<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSetosa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="petalSetosa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="sepalSetosa" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="40%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="goldSignal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <rect width="400" height="320" rx="20" fill="url(#bgSetosa)"/>
  <!-- Stem -->
  <path d="M 200 170 Q 198 250 195 310" stroke="#10b981" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Small Standards (Diminutive Petals - Key characteristic of Setosa: 1.0-1.9 cm) -->
  <path d="M 200 140 C 190 100 195 70 200 60 C 205 70 210 100 200 140 Z" fill="url(#petalSetosa)" stroke="#c7d2fe" stroke-width="1.5" opacity="0.95"/>
  <path d="M 190 145 C 175 110 170 85 180 75 C 187 88 190 115 190 145 Z" fill="url(#petalSetosa)" stroke="#c7d2fe" stroke-width="1.2" opacity="0.85"/>
  <path d="M 210 145 C 225 110 230 85 220 75 C 213 88 210 115 210 145 Z" fill="url(#petalSetosa)" stroke="#c7d2fe" stroke-width="1.2" opacity="0.85"/>
  <!-- Broad Falls (Sepals: 4.3-5.8 cm long, 2.3-4.4 cm wide) -->
  <!-- Left Fall -->
  <path d="M 195 155 C 150 160 100 180 85 220 C 80 250 120 270 150 250 C 175 230 190 185 195 155 Z" fill="url(#sepalSetosa)" stroke="#a5b4fc" stroke-width="2"/>
  <!-- Right Fall -->
  <path d="M 205 155 C 250 160 300 180 315 220 C 320 250 280 270 250 250 C 225 230 210 185 205 155 Z" fill="url(#sepalSetosa)" stroke="#a5b4fc" stroke-width="2"/>
  <!-- Center Fall -->
  <path d="M 185 160 C 160 190 165 240 185 270 C 200 290 215 270 235 240 C 240 190 215 160 185 160 Z" fill="url(#sepalSetosa)" stroke="#a5b4fc" stroke-width="2"/>
  <!-- Golden Signal Patches on Falls -->
  <ellipse cx="200" cy="210" rx="14" ry="25" fill="url(#goldSignal)" opacity="0.95"/>
  <ellipse cx="140" cy="215" rx="12" ry="20" fill="url(#goldSignal)" transform="rotate(-30 140 215)" opacity="0.9"/>
  <ellipse cx="260" cy="215" rx="12" ry="20" fill="url(#goldSignal)" transform="rotate(30 260 215)" opacity="0.9"/>
  <!-- Veins -->
  <path d="M 200 185 L 200 240 M 195 200 L 188 230 M 205 200 L 212 230" stroke="#fef08a" stroke-width="1.2" opacity="0.8"/>
  <!-- Calyx -->
  <circle cx="200" cy="160" r="10" fill="#047857"/>
  <!-- Species Badge -->
  <rect x="20" y="20" width="130" height="30" rx="8" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
  <text x="32" y="40" fill="#e0e7ff" font-family="sans-serif" font-size="13" font-weight="bold">Iris setosa</text>
  <text x="20" y="300" fill="#94a3b8" font-family="sans-serif" font-size="11">Dwarf Petals (1.0 - 1.9 cm)</text>
</svg>
