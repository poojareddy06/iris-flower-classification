<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgVersi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e38"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="petalVersi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <linearGradient id="sepalVersi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="50%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="throatGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
  </defs>
  <rect width="400" height="320" rx="20" fill="url(#bgVersi)"/>
  <!-- Stem -->
  <path d="M 200 160 Q 202 240 200 310" stroke="#059669" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Medium Standards (Well-developed intermediate petals: 3.0-5.1 cm long, 1.0-1.8 cm wide) -->
  <path d="M 200 135 C 180 80 185 40 200 30 C 215 40 220 80 200 135 Z" fill="url(#petalVersi)" stroke="#e9d5ff" stroke-width="1.5"/>
  <path d="M 185 140 C 150 90 145 60 165 45 C 180 65 190 100 185 140 Z" fill="url(#petalVersi)" stroke="#e9d5ff" stroke-width="1.2" opacity="0.9"/>
  <path d="M 215 140 C 250 90 255 60 235 45 C 220 65 210 100 215 140 Z" fill="url(#petalVersi)" stroke="#e9d5ff" stroke-width="1.2" opacity="0.9"/>
  <!-- Medium Arching Falls (Sepals: 4.9-7.0 cm) -->
  <!-- Left Fall -->
  <path d="M 190 150 C 140 160 80 190 70 235 C 75 270 125 275 155 245 C 175 220 185 180 190 150 Z" fill="url(#sepalVersi)" stroke="#d8b4fe" stroke-width="2"/>
  <!-- Right Fall -->
  <path d="M 210 150 C 260 160 320 190 330 235 C 325 270 275 275 245 245 C 225 220 215 180 210 150 Z" fill="url(#sepalVersi)" stroke="#d8b4fe" stroke-width="2"/>
  <!-- Center Fall -->
  <path d="M 180 155 C 150 190 155 245 180 280 C 200 305 220 280 245 245 C 250 190 220 155 180 155 Z" fill="url(#sepalVersi)" stroke="#d8b4fe" stroke-width="2"/>
  <!-- Throat Signal (Yellow-green throat with reddish-purple veins) -->
  <ellipse cx="200" cy="205" rx="16" ry="28" fill="url(#throatGreen)" opacity="0.9"/>
  <ellipse cx="130" cy="215" rx="14" ry="22" fill="url(#throatGreen)" transform="rotate(-35 130 215)" opacity="0.85"/>
  <ellipse cx="270" cy="215" rx="14" ry="22" fill="url(#throatGreen)" transform="rotate(35 270 215)" opacity="0.85"/>
  <!-- Prominent Harlequin Veining -->
  <path d="M 200 180 L 200 250 M 194 195 L 180 235 M 206 195 L 220 235 M 190 220 L 175 255 M 210 220 L 225 255" stroke="#581c87" stroke-width="1.5"/>
  <!-- Calyx -->
  <circle cx="200" cy="155" r="10" fill="#065f46"/>
  <!-- Species Badge -->
  <rect x="20" y="20" width="150" height="30" rx="8" fill="#4a044e" stroke="#c084fc" stroke-width="1"/>
  <text x="32" y="40" fill="#f5d0fe" font-family="sans-serif" font-size="13" font-weight="bold">Iris versicolor</text>
  <text x="20" y="300" fill="#94a3b8" font-family="sans-serif" font-size="11">Intermediate Petals (3.0 - 5.1 cm)</text>
</svg>
