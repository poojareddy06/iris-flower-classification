<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgVirg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e113a"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>
    <linearGradient id="petalVirg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="40%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="sepalVirg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="45%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="deepGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <rect width="400" height="320" rx="20" fill="url(#bgVirg)"/>
  <!-- Stem -->
  <path d="M 200 150 Q 198 235 200 310" stroke="#047857" stroke-width="9" stroke-linecap="round" fill="none"/>
  <!-- Large Tall Standards (Petal Length: 4.5 - 6.9 cm, Petal Width: 1.4 - 2.5 cm) -->
  <path d="M 200 130 C 170 70 175 25 200 15 C 225 25 230 70 200 130 Z" fill="url(#petalVirg)" stroke="#ddd6fe" stroke-width="1.8"/>
  <path d="M 180 135 C 135 75 130 40 155 25 C 175 45 185 85 180 135 Z" fill="url(#petalVirg)" stroke="#ddd6fe" stroke-width="1.4" opacity="0.95"/>
  <path d="M 220 135 C 265 75 270 40 245 25 C 225 45 215 85 220 135 Z" fill="url(#petalVirg)" stroke="#ddd6fe" stroke-width="1.4" opacity="0.95"/>
  <!-- Robust, Long Arching Falls (Sepal Length: 4.9 - 7.9 cm) -->
  <!-- Left Fall -->
  <path d="M 185 145 C 130 155 60 190 50 245 C 55 285 115 295 155 255 C 175 225 185 180 185 145 Z" fill="url(#sepalVirg)" stroke="#c4b5fd" stroke-width="2.2"/>
  <!-- Right Fall -->
  <path d="M 215 145 C 270 155 340 190 350 245 C 345 285 285 295 245 255 C 225 225 215 180 215 145 Z" fill="url(#sepalVirg)" stroke="#c4b5fd" stroke-width="2.2"/>
  <!-- Center Fall -->
  <path d="M 175 150 C 140 190 145 255 175 295 C 200 320 225 295 255 255 C 260 190 225 150 175 150 Z" fill="url(#sepalVirg)" stroke="#c4b5fd" stroke-width="2.2"/>
  <!-- Radiant Golden Signal Patch on Arching Falls -->
  <ellipse cx="200" cy="200" rx="18" ry="32" fill="url(#deepGold)" opacity="0.95"/>
  <ellipse cx="120" cy="215" rx="16" ry="26" fill="url(#deepGold)" transform="rotate(-40 120 215)" opacity="0.9"/>
  <ellipse cx="280" cy="215" rx="16" ry="26" fill="url(#deepGold)" transform="rotate(40 280 215)" opacity="0.9"/>
  <!-- Elegant Veining -->
  <path d="M 200 175 L 200 260 M 192 190 L 175 240 M 208 190 L 225 240" stroke="#fef08a" stroke-width="1.8" opacity="0.9"/>
  <!-- Calyx -->
  <circle cx="200" cy="150" r="11" fill="#047857"/>
  <!-- Species Badge -->
  <rect x="20" y="20" width="145" height="30" rx="8" fill="#3b0764" stroke="#a855f7" stroke-width="1"/>
  <text x="32" y="40" fill="#f3e8ff" font-family="sans-serif" font-size="13" font-weight="bold">Iris virginica</text>
  <text x="20" y="300" fill="#94a3b8" font-family="sans-serif" font-size="11">Largest Petals (4.5 - 6.9 cm)</text>
</svg>
