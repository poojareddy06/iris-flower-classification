services:
  # 1. FastAPI Machine Learning Backend API Service
  - type: web
    name: iris-ml-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: iris-db
          property: connectionString
      - key: AI_API_KEY
        sync: false

  # 2. React Vite Frontend Static Site
  - type: web
    name: iris-ml-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: iris-ml-backend
          property: host

databases:
  # 3. Managed PostgreSQL Database (Optional for persistent production records)
  - name: iris-db
    databaseName: iris_app
    user: iris_user
    plan: free
